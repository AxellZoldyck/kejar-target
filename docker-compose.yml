services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kejar_target
      POSTGRES_USER: kejar_target
      POSTGRES_PASSWORD: kejar_target
    ports:
      - "5432:5432"
    volumes:
      - kejar_target_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kejar_target -d kejar_target"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kejar_target_pgdata:
